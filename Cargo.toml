[package]
name = "astroute"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Per-application network access and interface routing for COSMIC"
default-run = "astroute"

[workspace]
members = ["crates/astroute-backend"]
default-members = [".", "crates/astroute-backend"]
resolver = "3"

[dependencies]
libcosmic = { git = "https://github.com/pop-os/libcosmic", rev = "5a8bd9482a35ae94c1e54edf77b331c6b970f170", default-features = false, features = ["winit", "wayland", "tokio", "dbus-config", "a11y", "multi-window", "single-instance"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "time", "io-util", "signal"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
i18n-embed = { version = "0.16", features = ["fluent-system", "desktop-requester"] }
i18n-embed-fl = "0.10"
rust-embed = "8"
ksni = "0.3.7"
resvg = { version = "0.45", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots"] }
semver = "1"
open = "5"

[profile.dev]
debug = 0

[profile.release]
lto = "thin"
strip = true
