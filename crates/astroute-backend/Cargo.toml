[package]
name = "astroute-backend"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Native networking helper and local settings for Astroute"

[[bin]]
name = "astroute-helper"
path = "src/main.rs"

[[bin]]
name = "astroute-install"
path = "src/bin/install.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
idna = "1"
ipnet = "2"
libc = "0.2"
regex = "1"
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shell-words = "1"
tokio = { version = "1", features = ["rt", "net", "io-util", "time", "sync", "macros"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
